[package]
name = "onlytax-ws"
version = "0.1.0"
edition = "2021"

[dependencies]
async-stream = "0.3.5"
rustls = { version = "0.23.16", features = ["ring"] }
axum = "0.7.5"
bincode = "1.3.3"
dotenv = "0.15.0"
env_logger = "0.11.5"
envconfig = "0.10.0"
eyre = "0.6.12"
futures = "0.3.30"
log = "0.4.22"
reqwest = { version = "0.12.4", features = ["json"] }
socketioxide = { version = "0.14.0", features = ["state", "extensions"] }
tokio = { version = "1.39.2", features = ["rt-multi-thread", "macros"] }
tower = "0.5.0"
tower-http = { version = "0.5.2", features = ["cors", "fs"] }
onlytax-storage = { path = "../storage" }
onlytax-api = { path = "../api" }
onlytax-blockchain = { path = "../blockchain" }
solana-client = "2.0.5"
solana-sdk = "2.0.5"
spl-token-2022 = "4.0.0"
spl-associated-token-account = "4.0.0"
serde = { version = "1.0", features = ["derive"] }
