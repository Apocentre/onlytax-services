[package]
name = "onlytax-storage"
version = "0.1.0"
edition = "2021"

[dependencies]
chrono = { version = "0.4.22", features = ["serde"] }
deadpool = { version = "0.12.1", features = ["rt_tokio_1"] }
deadpool-redis = { version = "0.15.1", features = ["rt_tokio_1"] }
diesel = { version = "2.0.0", features = ["postgres", "chrono", "numeric"]}
diesel-async = { version = "0.4.1", features = ["deadpool", "postgres"] }
futures-util = "0.3.21"
rustls = "0.23.8"
eyre = "0.6.8"
futures = "0.3.12"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.23", features = ["macros", "rt-multi-thread"] }
tokio-postgres = "0.7.7"
tokio-postgres-rustls = "0.12.0"
